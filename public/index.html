
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="./app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container">

        <header class="hero">
            <div class="pumpkin">🎃</div>
            <div class="hero-text">
                <p class="eyebrow">Fiesta de disfrazes</p>
                <h1>Lista de acceso</h1>
                <p class="subtitle">Gestiona los usuarios de que podran entrar a la fiesta.</p>
            </div>
            <div class="moon">🌕</div>
            <span class="bat bat-one">🦇</span>
            <span class="bat bat-two">🦇</span>
        </header>

        <section class="panel register-panel">
            <div class="section-heading">
                <span class="heading-icon">☠</span>
                <div>
                    <h2>Registrar usuario</h2>
                    <p>Agrega un nuevo miembro a la lista</p>
                </div>
            </div>

<form id="formUsuario">
    <div class="form-grid">
        <label>
            Nombre
            <input type="text" id="nombre" placeholder="Ingresa el nombre" required>
        </label>
        <label>
            Apellido
            <input type="text" id="apellido" placeholder="Ingresa el apellido" required>
        </label>

        <label>
            Correo electrónico
            <input type="email" id="correo" placeholder="Ingresa el correo" required>
        </label>

    <button class="btn btn-primary" type="button" onclick="registrarUsuario()">
        ♟ &nbsp; Registrar usuario
    </button>
</form>
        </section>

        <section class="panel users-panel">
            <div class="users-toolbar">
                <div class="section-heading">
                    <span class="heading-icon">👥</span>
                    <div>
                        <h2>Lista de usuarios</h2>
                        <p>Almas que ya forman parte de la fiesta</p>
                    </div>
                </div>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th class="actions-heading">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaUsuarios">
                    </tbody>
                </table>
            </div>

            <footer class="table-footer">
                <span>Mostrando 1–10 usuarios</span>
                <nav class="pagination" aria-label="Paginación">
                    <button type="button" disabled>‹</button>
                    <button type="button" class="current">1</button>
                    <button type="button" disabled>›</button>
                </nav>
            </footer>
        </section>

    </main>

</body>
</html>
